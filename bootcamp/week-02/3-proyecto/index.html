<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Colección - Master v2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Gestion de Bodegas</h1>
            <p>Adaptado a tu dominio asignado</p>
            <div class="main-stats">
                <div class="stat-card">Total: <span id="stat-total">0</span></div>
                <div class="stat-card">Activos: <span id="stat-active">0</span></div>
                <div class="stat-card">Inactivos: <span id="stat-inactive">0</span></div>
            </div>
        </header>

        <section class="add-section">
            <h2>➕ Nuevo Elemento</h2>
            <form id="item-form">
                <div class="input-group">
                    <label>Nombre *</label>
                    <input type="text" id="item-name" placeholder="Ej: OREO FRESA" required>
                </div>
                <div class="input-group">
                    <label>Descripción</label>
                    <textarea id="item-desc" placeholder="Detalles adicionales (opcional)"></textarea>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label>Categoría</label>
                        <select id="item-category">
                            <option value="category1">🔹 Categoría 1</option>
                            <option value="category2">🔹 Categoría 2</option>
                            <option value="category3">🔹 Categoría 3</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Prioridad/Nivel</label>
                        <select id="item-priority">
                            <option value="low">🟡 Baja</option>
                            <option value="medium">🟠 Media</option>
                            <option value="high">🔴 Alta</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-create">Crear Elemento</button>
            </form>
        </section>

        <section class="filters-section">
            <div class="filters-grid">
                <div class="filter-item">
                    <label>Estado:</label>
                    <select id="filter-status">
                        <option value="all">Todos</option>
                        <option value="active">Activos</option>
                        <option value="inactive">Inactivos</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>Categoría:</label>
                    <select id="filter-category">
                        <option value="all">Todas</option>
                        <option value="category1">Categoría 1</option>
                        <option value="category2">Categoría 2</option>
                        <option value="category3">Categoría 3</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>Prioridad:</label>
                    <select id="filter-priority">
                        <option value="all">Todas</option>
                        <option value="low">Baja</option>
                        <option value="medium">Media</option>
                        <option value="high">Alta</option>
                    </select>
                </div>
                <div class="filter-item search-box">
                    <label>Buscar:</label>
                    <input type="text" id="search-input" placeholder="Buscar por nombre...">
                </div>
            </div>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h2>📝 Lista de Elementos</h2>
                <button id="clear-inactive" class="btn-clear-inactives">🗑️ Limpiar Inactivos</button>
            </div>

            <div id="empty-state-msg" style="display: none; text-align: center; margin-top: 30px;">
                <p>🔍 No hay elementos que coincidan con tu búsqueda.</p>
            </div>

            <div id="item-list">
                </div>
        </section>

        <footer class="detailed-stats">
            <h3>📊 Resumen por Categoría</h3>
            <div id="detailed-stats-content">
                </div>
        </footer>
    </div>

    <script src="starter/script.js"></script>
</body>
</html>
