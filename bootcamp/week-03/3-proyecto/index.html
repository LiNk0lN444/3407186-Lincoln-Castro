<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión de Bodegas - Herramientas</title>
    <style>
        /* CONFIGURACIÓN DE COLORES Y VARIABLES */
        :root {
            --bg-dark: #0d1117;
            --panel-dark: #161b22;
            --card-dark: #21262d;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --accent-yellow: #f0db4f;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-blue: #388bfd;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            padding: 40px;
            margin: 0;
        }

        h1 { font-size: 24px; font-weight: 600; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }

        /* NAVEGACIÓN (BOTONES SUPERIORES) */
        nav { display: flex; gap: 12px; margin-bottom: 30px; }

        .tab-btn { 
            padding: 8px 16px; 
            background: var(--card-dark); 
            color: var(--text-main); 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .tab-btn:hover { background: #30363d; border-color: #8b949e; }
        .tab-btn.active { 
            background: var(--accent-yellow); 
            color: black; 
            border-color: var(--accent-yellow);
            font-weight: 600;
        }

        /* CONTENEDOR PRINCIPAL */
        .panel-content { 
            background: var(--panel-dark); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 { font-size: 20px; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        /* FORMULARIOS E INPUTS */
        .form-row { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }

        input, select {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.3); }

        button[type="submit"] {
            background: var(--accent-yellow);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* TARJETAS DE ELEMENTOS (EL CATÁLOGO) */
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

        .item-card { 
            background: var(--card-dark); 
            padding: 16px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            transition: transform 0.1s, border-color 0.2s;
        }

        .item-card:hover { border-color: #8b949e; transform: translateY(-2px); }

        .item-info strong { color: white; display: block; font-size: 16px; margin-bottom: 4px; }
        .item-info small { color: var(--text-dim); font-size: 12px; }

        /* BADGES (ESTADOS) */
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-disponible { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; }
        .status-prestamo { background: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid #da3633; }

        /* ESTADÍSTICAS */
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .stat-card { 
            background: var(--card-dark); 
            padding: 24px; 
            border-radius: 10px; 
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .stat-card h3 { font-size: 32px; color: var(--accent-yellow); margin: 0; }
        .stat-card p { color: var(--text-dim); margin: 5px 0 0; font-size: 13px; }

        /* TRANSACCIONES (LOGS) */
        .log-entry {
            background: #0d1117;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1> Sistema de Gestión de Elementos: Herramientas</h1>
    <h2>Sistema para la gestión de herramientas, usuarios
     y transacciones en una bodega de construcción   
    </h2>
    <nav>
        <button class="tab-btn active" onclick="showSection('catalog', event)">📄 Catálogo</button>
        <button class="tab-btn" onclick="showSection('users', event)">👥 Usuarios</button>
        <button class="tab-btn" onclick="showSection('transactions', event)">🔄 Transacciones</button>
        <button class="tab-btn" onclick="showSection('stats', event)">📊 Estadísticas</button>
    </nav>

    <main>
        <section id="catalog" class="panel-content">
            <h2>Inventario de Herramientas</h2>
            <form id="tool-form" class="form-row">
                <input type="text" id="t-name" placeholder="Ej. Taladro Percutor" required style="flex: 2;">
                <select id="t-type">
                    <option value="manual">🛠 Manual</option>
                    <option value="electrica">⚡ Eléctrica</option>
                </select>
                <select id="t-priority">
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                </select>
                <button type="submit">+ Agregar</button>
            </form>

            
<div class="filters-container" style="display: flex; gap: 10px; margin-bottom: 20px; background: #21262d; padding: 15px; border-radius: 8px;">
    
    <input type="text" id="search-input" placeholder="🔍 Buscar herramienta..." 
           style="flex: 2; padding: 8px; border-radius: 4px; border: 1px solid #30363d; background: #0d1117; color: white;">

    <select id="filter-type" style="flex: 1; padding: 8px; border-radius: 4px; background: #0d1117; color: white;">
        <option value="all">Todos los tipos</option>
        <option value="electrica">Eléctricas ⚡</option>
        <option value="manual">Manuales 🛠️</option>
    </select>

    <select id="filter-status" style="flex: 1; padding: 8px; border-radius: 4px; background: #0d1117; color: white;">
        <option value="all">Cualquier estado</option>
        <option value="Disponible">Disponible</option>
        <option value="En Préstamo">En Préstamo</option>
    </select>
</div>

<div id="item-list"></div>
            <div id="item-list" class="item-grid">
                </div>
        </section>

        <section id="users" class="panel-content" style="display:none;">
            <h2>Gestión de Personal</h2>
            <div id="users-list"></div>
        </section>

        <section id="transactions" class="panel-content" style="display:none;">
            <h2>Historial de Movimientos</h2>
            <div id="transactions-list"></div>
        </section>

        <section id="stats" class="panel-content" style="display:none;">
            <h2>Panel de Control</h2>
            <div id="stats-content" class="stat-grid"></div>
        </section>
    </main>

    <script src="starter/script.js"></script>
</body>
</html>
